<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="ellaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#312e81" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background rounded card -->
  <rect width="512" height="512" rx="108" fill="url(#ellaGrad)"/>
  <rect x="24" y="24" width="464" height="464" rx="84" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="4"/>

  <!-- Center Decorative Glow/Shield -->
  <g filter="url(#shadow)">
    <!-- Book / Sparkle Emblem -->
    <path d="M256 120 L270 170 L320 184 L270 198 L256 248 L242 198 L192 184 L242 170 Z" fill="#fbbf24"/>
    <circle cx="340" cy="140" r="8" fill="#fde68a"/>
    <circle cx="172" cy="140" r="8" fill="#fde68a"/>
    
    <!-- Main ELLA Brand Typography -->
    <text x="256" y="320" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="124" fill="#ffffff" text-anchor="middle" letter-spacing="4">ELLA</text>
    
    <!-- Subtitle -->
    <text x="256" y="380" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="28" fill="#e0e7ff" text-anchor="middle" letter-spacing="3">GRAMMAR STUDIO</text>
    <text x="256" y="420" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="20" fill="#c7d2fe" text-anchor="middle" letter-spacing="1">CLASS 6–10 • 100% OFFLINE</text>
  </g>
</svg>
